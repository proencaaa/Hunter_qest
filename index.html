<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>HunterQuest</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Oswald:wght@200..700&family=Rye&display=swap" rel="stylesheet">
</head>
<body>
    <section class="cabecera">
        <div class="topo">
            <img src="img/menu.png" alt="img-menu" class="img-menu">
            <img src="img/name-card.png" alt="name-card" class="name-card">
            <img src="img/perfil.png" alt="perfil" class="perfil">
        </div>
    </section>
    <section class="principal">
        <div class="dados">
           <h1 id="a">Bem vindo <br> Jogador!</h1>
           <p>Classe: Guerreiro</p>
           <p>Level: 5</p>
           <p>Arma: Espada</p>  
        </div>
        <div class="botoes">
            <button id="missao" class="botao">Missões</button><br>
            <button class="botao">Inventário</button>
            <button class="botao">Habilidades</button>
        </div>
    </section>
        
</body>
</html>
